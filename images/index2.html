<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User sign-up form</title>
</head>
<body>
  <h2>Create a New account</h2>
   <!-- Form Container -->
    <form action="/submit-form" method="POST" >
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required><br>
      <br>
      <label>Email Address:</label>
      <input type="email" placeholder="abcd@gmail.com" required><br>
      <br>
      <label>Password</label>
      <input type="password" placeholder="Creat a strong password" required><br>
      <br>
      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="male">
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <label for="female">Female</label>
    </form>

  
</body>
</html>
