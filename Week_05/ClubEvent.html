    <div class="container">
        <h1>CodingClub</h1>

    <main>

     <h2>Upcoming Event</h2>
        
      <table class="table"  width="500px" >
            <caption>Club Events</caption>
         <thead>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
         </thead>

        <h2>Resister</h2>

        <div class="container2">
            <label for="name">Name:</label>
            <input type="name" id="name"  placeholder="Enter Your Name" required>
            <br><br>

            <label for="email">Email:</label>
             <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
          
             <br><br>

            <label for="password">Password:</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
           <br><br>

            <label for="Date of birth">Date of birth:</label>
              <input type="date" id="dob" name="date of birth" placeholder="dd/mm/yy" required
          <br><br><br>

            <label for="phone">Phone:</label>
              <input type="phone" id="phone" name="phone" placeholder="" required>
          <br><br>

            <label for="gender">Gender:</label>
              <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
              <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
          <br><br>

            <label for="interests">Interests:</label>
              <input type="radio" id="web" name="Interests" value="Web">
            <label for="Web">Web</label>
              <input type="radio" id="dsa" name="Interests" value="dsa">
            <label for="dsa">DSA</label>
          <br><br>

            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="BCA">BCA</option>
                <option value="B.TECH(cse)">B.TECH(cse)</option>
                <option value="MBA">MBA</option>
                <option value="BBA">BBA</option>
                <option value="LLB">LLB</option>
            </select>
        
            <br><br>
            <div>
                <tr>
                    <td valign="top"><label for="message">Your Message:</label></td>
                    <td><textarea id="message" name="message" rows="5" cols="30" required placeholder="Write your text here..."></textarea></td>
                </tr>
                
              
            </div>
                <br>
        
            <button class="submit">Resister</button>
        </div>
