<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #b2c3dc;
        }

        
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #6b1265;
            color: white;
            padding: 14px;
            text-align: center;
        }

        .card {
            width: 300px;
            margin: 20px auto;
            background: rgb(245, 246, 248);
            border: 2px solid #040710;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #e62c2c;
            color: white;
            font-size: 36px;
            line-height: 90px;
            margin: 0 auto 10px;
        }

        
        .bio {
            height: 80px;
            overflow: auto;
            text-align: left;
            border: 1px solid rgb(9, 9, 26);
            padding: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-style: italic;
            color: crimson;
        }

        
        .fab {
            position: fixed;
            right: 16px;
            bottom: 16px;
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #ffb703;
            font-size: 26px;
        }
    </style>
</head>

<body>
    <header>My Profile Page</header>
    <div class="card">
        <div class="avatar">J</div>
        <h2>Jay Kumar</h2>
        <p>Web Developer in Making</p>
        <div class="bio">
            Hi! I am Jay Kumar. i am student of b.tech(cse) at invertis university. I like singing and playing cricket;
        </div>
    </div>
    <button class="fab">+</button>
</body>

</html>
